# Local development server. No Ruby needed on the host.
#
#   docker compose up        ->  http://localhost:8080
#   docker compose down
#
# Build output goes to container-local /tmp/_site rather than the bind-mounted
# _site: writing it back across the host mount is slow and, on Windows/macOS,
# deadlock-prone. The named `bundle` volume caches installed gems between runs.
services:
  site:
    image: ruby:3.3
    working_dir: /site
    command: >
      bash -lc "bundle install --quiet &&
      bundle exec jekyll serve
      --host 0.0.0.0 --port 8080
      --livereload --force_polling
      --destination /tmp/_site"
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/site
      - bundle:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development

volumes:
  bundle:
