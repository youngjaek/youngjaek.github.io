# Resume data in RenderCV format, rendered by _pages/resume.md.
#
# Section keys under `sections` are matched by name; display order comes from
# `cv_section_order` in the page front matter.
#
# The top-level contact fields (name / label / email / phone / website /
# address) and `summary` are deliberately absent: the local render override
# does not emit the "Contact Information" or "Professional Summary" cards,
# because the about page already covers both.
#
# `start_date` / `end_date` exist so al_folio_cv's al_cv_sort_by_date filter can
# order entries; `period` is what actually gets displayed. `logo` is a filename
# in assets/img/logos/, and `monogram` is the fallback when there is no logo.

cv:
  sections:
    Education:
      - institution: University of Maryland
        degree: B.S.
        area: Computer Science & Mathematics
        location: College Park, MD
        url: https://umd.edu/
        logo: umd.png
        period: Expected May 2027
        date: 2027-05
        facts:
          - label: GPA
            value: 3.534 / 4.0
          - label: Honors
            value: CS Departmental Honors, Dean's List
          - label: CS
            value: Computer Networks, Database Design, Compilers, Design & Analysis of Computer Algorithms, Advanced Data Structures, Computer Vision
          - label: Math
            value: Advanced Calculus I/II, Linear Algebra, Probability Theory

    Experience:
      - company: Easy Dynamics
        position: Software Engineer Intern
        location: McLean, VA
        url: https://www.easydynamics.com/
        logo: easydynamics.svg
        period: Jun 2026 - Present
        start_date: 2026-06
        end_date: present
        highlights:
          - Built a **multi-region Azure network foundation in Terraform** across two-week sprints, provisioning hub-and-spoke VNets, flow logging, and per-region diagnostics with input validation for region support, CIDR overlaps, and subnet containment, verified by Terraform tests in a plan-only CI gate.
          - Automated IaC release workflows with CI/CD pipelines, promoting Terraform modules from source repositories into an internal artifact registry and eliminating manual release drift.
          - Validated reusable Terraform modules across multiple Azure regions against **NIST 800-53** and federal compliance standards, documenting severity-rated gaps and recommendations adopted by module maintainers and platform architects.

      - company: Mindgrasp
