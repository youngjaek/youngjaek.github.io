        location: Bethesda, MD
        url: https://www.mindgrasp.ai/
        logo: mindgrasp.svg
        period: Oct 2025 - May 2026
        start_date: 2025-10
        end_date: 2026-05
        highlights:
          - Built a **retrieval and context-construction layer (RAG)** for an internal customer support application, assembling relevant ticket and knowledge-base context to auto-draft agent replies.
          - Implemented a **multi-step agentic workflow with tool calling** to gather and refine context across sources, reducing manual editing time by **28%** across roughly 60 drafts per week.
          - Refactored a monolithic Flask backend into modular blueprints with shared middleware and centralized error handling; reviewed 10+ pull requests as the primary technical reviewer on the codebase.

      - company: EchoIT
        position: Software Engineer
        location: Seoul, South Korea
        url: https://echoit.co.kr/
        logo: echoit.png
        period: Jul 2023 - Aug 2025
        start_date: 2023-07
        end_date: 2025-08
        highlights:
