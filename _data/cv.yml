          - Engineered an **SMS verification service with RabbitMQ** handling 5,000 messages/min, ensuring reliable asynchronous processing with average task time under 50 ms.
          - Developed and maintained **15+ full-stack features** for a B2B platform using Java (Spring Boot) and MariaDB, owning the lifecycle from schema design to frontend implementation with jQuery.
          - Built reusable microservice components in a Node.js backend framework and prototyped Elasticsearch integration for search; deployed through a Jenkins and Docker CI/CD pipeline.

