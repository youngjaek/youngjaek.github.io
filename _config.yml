# ------------------------------------------------------------------------------
# Build
# ------------------------------------------------------------------------------

# al-folio remains the theme runtime. Every layout, include and stylesheet this
# site actually renders is overridden locally in _layouts/, _includes/ and
# _sass/ — Jekyll resolves local files before theme-gem files. Overriding rather
# than forking keeps `bundle update` a viable upgrade path.
theme: al_folio_core

plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  work:
    output: true
    permalink: /work/:name/

permalink: /notes/:year/:slug/
paginate: false

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: post }
  - scope: { path: "", type: "work" }
    values: { layout: work }
  - scope: { path: "" }
    values: { layout: page }

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

sass:
  style: compressed
  sourcemap: never

feed:
  path: feed.xml

# Jekyll's theme-asset reader ignores `exclude`, so _plugins/prune_theme_assets.rb
# removes gem-provided static files instead. Nothing on this site loads them —
# see the performance budget in CLAUDE.md.
prune_theme_assets: true

include:
  - _pages
exclude:
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yml
  - node_modules
  - package.json
  - vendor
keep_files:
  - CNAME
  - .nojekyll
