name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check for broken internal links
        run: |
          bundle exec ruby -e '
            require "set"
            root = "_site"
            broken = []
            Dir.glob("#{root}/**/*.html").each do |file|
              html = File.read(file)
              html.scan(/(?:href|src)="([^"#][^"]*)"/).flatten.each do |link|
                next if link.start_with?("http", "mailto:", "data:", "//")
                path = link.split("#").first.split("?").first
                next if path.nil? || path.empty?
                target = path.start_with?("/") ? File.join(root, path) : File.join(File.dirname(file), path)
                ok = File.exist?(target) || File.exist?(File.join(target, "index.html"))
                broken << "#{file} -> #{link}" unless ok
              end
            end
            if broken.any?
              puts "Broken internal links:"
              puts broken.uniq
              exit 1
            end
            puts "No broken internal links."
          '

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
